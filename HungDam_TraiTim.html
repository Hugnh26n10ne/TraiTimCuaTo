<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>HungDam_TraiTim</title>
  <meta name="Author" content="HungDam_TraiTim">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { background: #000; image-rendering: pixelated; }
  </style>
</head>
<body>
<canvas id="heart" width="640" height="480"></canvas>
<script>
// Port 1:1 từ HungDam_TraiTim.py (tkinter) sang canvas HTML
const CANVAS_WIDTH = 640, CANVAS_HEIGHT = 480;
const CX = CANVAS_WIDTH / 2, CY = CANVAS_HEIGHT / 2;
const IMAGE_ENLARGE = 11;
const HEART_COLOR = "#f76070"; // chỉnh màu ở đây

const rand = () => Math.random() || 1e-12;
const randint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const uniform = (a, b) => a + Math.random() * (b - a);
const choice = arr => arr[Math.floor(Math.random() * arr.length)];

function heartFunction(t, shrinkRatio = IMAGE_ENLARGE) {
  let x = 16 * Math.pow(Math.sin(t), 3);
  let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
  x = x * shrinkRatio + CX;
  y = y * shrinkRatio + CY;
  return [Math.trunc(x), Math.trunc(y)];
}

function scatterInside(x, y, beta = 0.15) {
  const rx = -beta * Math.log(rand());
  const ry = -beta * Math.log(rand());
  return [x - rx * (x - CX), y - ry * (y - CY)];
}

function shrink(x, y, ratio) {
  const force = -1 / Math.pow((x - CX) ** 2 + (y - CY) ** 2, 0.6);
  return [x - ratio * force * (x - CX), y - ratio * force * (y - CY)];
}

const curve = p => 2 * (2 * Math.sin(4 * p)) / (2 * Math.PI);

class Heart {
  constructor(generateFrame = 20) {
    this.points = new Map();
    this.edgeDiffusion = new Map();
    this.centerDiffusion = new Map();
    this.allPoints = [];
    this.build(2000);
    this.generateFrame = generateFrame;
    for (let f = 0; f < generateFrame; f++) this.calc(f);
  }
  build(number) {
    for (let i = 0; i < number; i++) {
      const [x, y] = heartFunction(uniform(0, 2 * Math.PI));
      this.points.set(x + "," + y, [x, y]);
    }
    for (const [px, py] of this.points.values()) {
      for (let i = 0; i < 3; i++) {
        const [x, y] = scatterInside(px, py, 0.05);
        this.edgeDiffusion.set(x + "," + y, [x, y]);
      }
    }
    const list = [...this.points.values()];
    for (let i = 0; i < 4000; i++) {
      const [px, py] = choice(list);
      const [x, y] = scatterInside(px, py, 0.17);
      this.centerDiffusion.set(x + "," + y, [x, y]);
    }
  }
  static calcPosition(x, y, ratio) {
    const force = 1 / Math.pow((x - CX) ** 2 + (y - CY) ** 2, 0.520);
    const dx = ratio * force * (x - CX) + randint(-1, 1);
    const dy = ratio * force * (y - CY) + randint(-1, 1);
    return [x - dx, y - dy];
  }
  calc(frame) {
    const c = curve(frame / 10 * Math.PI);
    const ratio = 10 * c;
    const haloRadius = Math.trunc(4 + 6 * (1 + c));
    const haloNumber = Math.trunc(3000 + 4000 * Math.abs(c * c));
    const all = [];
    const halo = new Set();
    for (let i = 0; i < haloNumber; i++) {
      let [x, y] = heartFunction(uniform(0, 2 * Math.PI), 11.6);
      [x, y] = shrink(x, y, haloRadius);
      const key = x + "," + y;
      if (!halo.has(key)) {
        halo.add(key);
        all.push([x + randint(-14, 14), y + randint(-14, 14), choice([1, 2, 2])]);
      }
    }
    for (const [px, py] of this.points.values()) {
      const [x, y] = Heart.calcPosition(px, py, ratio);
      all.push([x, y, randint(1, 3)]);
    }
    for (const [px, py] of this.edgeDiffusion.values()) {
      const [x, y] = Heart.calcPosition(px, py, ratio);
      all.push([x, y, randint(1, 2)]);
    }
    for (const [px, py] of this.centerDiffusion.values()) {
      const [x, y] = Heart.calcPosition(px, py, ratio);
      all.push([x, y, randint(1, 2)]);
    }
    this.allPoints[frame] = all;
  }
  render(ctx, frame) {
    ctx.fillStyle = HEART_COLOR;
    for (const [x, y, s] of this.allPoints[frame % this.generateFrame]) ctx.fillRect(x, y, s, s);
  }
}

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");
const heart = new Heart();
let frame = 0;
function draw() {
  ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  heart.render(ctx, frame++);
  setTimeout(draw, 160); // cùng nhịp 160ms như bản Python
}
draw();
</script>
</body>
</html>
