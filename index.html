<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HungDam_TraiTim</title>
  <meta name="Author" content="HungDam_TraiTim">
  <meta name="theme-color" content="#000000">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; background: #000; }
    #bar {
      position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px;
      pointer-events: none;
    }
    #bar button {
      pointer-events: auto; padding: 10px 18px; border: 1px solid #f76070; border-radius: 24px;
      background: rgba(0,0,0,.65); color: #ffb3c1; font-size: 15px; cursor: pointer; opacity: .75;
    }
    #bar button:hover, #bar button:active { opacity: 1; background: rgba(247,96,112,.25); }
    @media (max-width: 600px) {
      #bar { gap: 6px; padding: 0 8px; flex-wrap: wrap; }
      #bar button { padding: 8px 12px; font-size: 13px; }
    }
    #file, #coverFile { display: none; }
    body.viewer #setupBtn { display: none; }          /* người xem qua link QR: chỉ có nút Xem lại */
    body:not(.viewer) #replayBtn { display: none; }
    #setupModal textarea {
      width: 100%; box-sizing: border-box; min-height: 110px; resize: vertical; font: 15px/1.5 system-ui, sans-serif;
      border: 1px solid #f3c1c9; border-radius: 10px; padding: 10px; margin-bottom: 6px; color: #222;
    }
    .modal .box.wide { width: min(94vw, 430px); max-height: 88vh; overflow: auto; }
    .field { text-align: left; margin-bottom: 14px; }
    .field > label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    .pick { padding: 7px 12px; border: 1px dashed #f76070; border-radius: 10px; background: #fff5f6; color: #c84b5a; font-size: 13px; cursor: pointer; margin-right: 6px; }
    .coverRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .coverPrev { width: 56px; height: 72px; object-fit: cover; border-radius: 8px; background: #eee; }
    .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .thumbs .t { position: relative; width: 56px; height: 72px; border-radius: 8px; overflow: hidden; background: #eee; }
    .thumbs .t img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumbs .t button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border: none; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 12px; line-height: 18px; padding: 0; cursor: pointer; }
    .switch { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #333; cursor: pointer; }
    .switch input { width: 18px; height: 18px; accent-color: #f76070; }
    .status { font-size: 12px; color: #888; min-height: 16px; text-align: left; margin-bottom: 10px; }
    #toast {
      position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.75); color: #ffb3c1; border: 1px solid #f76070; border-radius: 20px;
      padding: 8px 16px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; text-align: center;
    }
    #toast.show { opacity: 1; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal.show { display: flex; }
    .modal .box { background: #fff; color: #222; border-radius: 16px; padding: 20px; width: min(92vw, 340px); text-align: center; }
    .modal h3 { margin: 0 0 12px; color: #f76070; font-size: 18px; }
    #qr { display: flex; justify-content: center; margin: 0 auto 12px; }
    #qr img, #qr canvas { border-radius: 8px; }
    #link { font-size: 12px; word-break: break-all; color: #555; background: #f6f6f6; border-radius: 8px; padding: 8px; margin-bottom: 12px; }
    .modal .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .modal .row button { padding: 9px 14px; border: none; border-radius: 20px; background: #f76070; color: #fff; font-size: 14px; cursor: pointer; }
    .modal .row button.ghost { background: #eee; color: #444; }
  </style>
</head>
<body>
<canvas id="heart"></canvas>

<div id="bar">

<div id="setupModal" class="modal">
  <div class="box wide">
    <h3>Thiết lập trái tim</h3>
    <div class="field">
      <label>Lời nhắn mở đầu (mỗi dòng một câu, để trống thì trái tim hiện ngay)</label>
      <textarea id="msgText" placeholder="Gửi đến người mình thương&#10;Mỗi nhịp đập này là dành cho bạn"></textarea>
    </div>
    <div class="field">
      <label>Ảnh nền (áo đen, khung cổ đến ngực; sẽ zoom vào ngực rồi tim hiện ra)</label>

    </div>

    <div class="row">
      <button id="previewBtn" class="ghost">Xem thử</button>
      <button id="qrBtn">Tạo QR</button>
      <button id="setupCloseBtn" class="ghost">Đóng</button>

  </div>
</div>

<div id="modal" class="modal">
  <div class="box">
    <h3>Gửi trái tim này cho người ấy</h3>
    <div id="qr"></div>
    <div id="link"></div>
    <div class="row">
      <button id="dlBtn">Tải ảnh QR</button>
      <button id="copyBtn">Sao chép link</button>
      <button id="shareBtn">Chia sẻ</button>
      <button id="closeBtn" class="ghost">Đóng</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ====== CẤU HÌNH ======
const HEART_COLOR = "#f76070";          // màu trái tim
const HEART_SCALE = 1.6;                 // độ to của trái tim (1 = bằng bản Python)
const ORBIT_RADIUS = 600;                // bán kính ngang của vòng elip (px)
const ORBIT_DEPTH = 0.4;                 // độ sâu so với chiều ngang (1 = tròn, càng nhỏ elip càng dẹt)
const ORBIT_TILT = 0.3;                  // độ nghiêng nhìn từ trên xuống (0 = nhìn ngang hoàn toàn)
const ORBIT_SPEED = 0.45;                // tốc độ xoay trung bình (rad/giây)
const ORBIT_EASE = 0.65;                 // 0 = đều; càng gần 1 ảnh càng chậm lại khi ra phía trước và vút nhanh khi ra sau
const SOUND_VOLUME = 1.0;                // âm lượng tiếng tim đập (0..1)
const PERSPECTIVE = 1400;                // càng nhỏ, hiệu ứng xa gần càng mạnh
const PHOTO_W = 150, PHOTO_H = 194;      // kích thước thẻ ảnh (px)
const PHOTO_RADIUS = 16;                 // bo góc thẻ ảnh
const REFLECT_HEIGHT = 0.45;             // chiều cao phản chiếu so với ảnh (0..1)
const REFLECT_ALPHA = 0.3;               // độ rõ của phản chiếu ở sát mép ảnh
const REFLECT_GAP = 3;                   // khe hở giữa ảnh và mặt nước (px)
const UPLOAD_MAX_SIDE = 900;             // ảnh tải lên được thu nhỏ về cạnh dài tối đa này (px)
const DEFAULT_MESSAGES = [               // lời nhắn mặc định (người tạo sửa bằng nút "Lời nhắn")
  "Gửi đến người mình thương",
  "Mỗi nhịp đập này là dành cho bạn",
];
const TEXT_IN = 900, TEXT_HOLD = 1000, TEXT_OUT = 700;   // ms: chữ hiện dần, giữ 1 giây, mờ đi
const TEXT_COLOR = "#ffd1d9";            // màu chữ
const COVER_IMAGE = "cover.jpg";         // ảnh nền (cổ đến ngực) đặt cạnh index.html; không có file thì bỏ qua pha zoom
const COVER_FOCUS_X = 0.64, COVER_FOCUS_Y = 0.55;   // vị trí trái tim trên ảnh nền (tỉ lệ 0..1 theo chiều ngang/dọc)
const COVER_FADE_IN_MS = 900;            // ảnh nền hiện dần
const COVER_HOLD_MS = 900;               // đứng yên trước khi zoom
const COVER_ZOOM_MS = 3600;              // thời gian zoom vào ngực
const COVER_ZOOM = 2.4;                  // zoom tối đa (lần)
const COVER_FADE_OUT_MS = 1000;          // ảnh nền chìm vào đen khi tim xuất hiện
const GLOW_RGB = "255, 45, 80";          // màu quầng đỏ
const EMERGE_MS = 3200;                  // tim đập lớn dần từ bé tới cỡ mặc định (4 nhịp)
const PHOTOS_DELAY_MS = 3000;            // tim ổn định bao lâu thì ảnh thẻ mới chạy
const PHOTOS_FADE_MS = 1200;             // ảnh thẻ hiện dần (ms)
const COVER_MAX_SIDE = 1600;             // ảnh nền tải lên thu về cạnh dài này
// ======================

// ---- Trái tim: port 1:1 từ HungDam_TraiTim.py ----
const IMAGE_ENLARGE = 11;
let CX = 320, CY = 240, FIT = 1;        // FIT: hệ số co giãn theo cửa sổ
const rand = () => Math.random() || 1e-12;
const randint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const uniform = (a, b) => a + Math.random() * (b - a);
const choice = arr => arr[Math.floor(Math.random() * arr.length)];

function heartFunction(t, shrinkRatio = IMAGE_ENLARGE) {
  let x = 16 * Math.pow(Math.sin(t), 3);
  let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
  return [Math.trunc(x * shrinkRatio), Math.trunc(y * shrinkRatio)];
}
function scatterInside(x, y, beta) {
  const rx = -beta * Math.log(rand()), ry = -beta * Math.log(rand());
  return [x - rx * x, y - ry * y];
}
function shrink(x, y, ratio) {
  const force = -1 / Math.pow(x * x + y * y, 0.6);
  return [x - ratio * force * x, y - ratio * force * y];
}
const curve = p => 2 * (2 * Math.sin(4 * p)) / (2 * Math.PI);

class Heart {
  constructor(generateFrame = 20) {
    this.points = new Map(); this.edge = new Map(); this.center = new Map(); this.frames = [];
    this.build(2000);
    this.generateFrame = generateFrame;
    for (let f = 0; f < generateFrame; f++) this.calc(f);
  }
  build(n) {
    for (let i = 0; i < n; i++) { const [x, y] = heartFunction(uniform(0, 2 * Math.PI)); this.points.set(x + "," + y, [x, y]); }
    for (const [px, py] of this.points.values()) for (let i = 0; i < 3; i++) { const [x, y] = scatterInside(px, py, 0.05); this.edge.set(x + "," + y, [x, y]); }
    const list = [...this.points.values()];
    for (let i = 0; i < 4000; i++) { const [px, py] = choice(list); const [x, y] = scatterInside(px, py, 0.17); this.center.set(x + "," + y, [x, y]); }
  }
  static pos(x, y, ratio) {
    const force = 1 / Math.pow(x * x + y * y, 0.520);
    return [x - (ratio * force * x + randint(-1, 1)), y - (ratio * force * y + randint(-1, 1))];
  }
  calc(frame) {
    const c = curve(frame / 10 * Math.PI), ratio = 10 * c;
    const haloR = Math.trunc(4 + 6 * (1 + c)), haloN = Math.trunc(3000 + 4000 * Math.abs(c * c));
    const all = [], halo = new Set();
    for (let i = 0; i < haloN; i++) {
      let [x, y] = heartFunction(uniform(0, 2 * Math.PI), 11.6); [x, y] = shrink(x, y, haloR);
      const k = x + "," + y;
      if (!halo.has(k)) { halo.add(k); all.push([x + randint(-14, 14), y + randint(-14, 14), choice([1, 2, 2])]); }
    }
    for (const [px, py] of this.points.values()) { const [x, y] = Heart.pos(px, py, ratio); all.push([x, y, randint(1, 3)]); }
    for (const [px, py] of this.edge.values())   { const [x, y] = Heart.pos(px, py, ratio); all.push([x, y, randint(1, 2)]); }
    for (const [px, py] of this.center.values()) { const [x, y] = Heart.pos(px, py, ratio); all.push([x, y, randint(1, 2)]); }
    this.frames[frame] = all;
  }
  render(ctx, frame, grow = 1) {
    ctx.fillStyle = HEART_COLOR;
    const k = HEART_SCALE * FIT * grow, oy = -26 * k;       // dịch lên để tâm hình nằm đúng giữa màn hình
    for (const [x, y, s] of this.frames[frame % this.generateFrame]) ctx.fillRect(CX + x * k, CY + oy + y * k, s * k, s * k);
  }
}

// ---- Ảnh chạy quanh tim (vòng 3D nằm ngang) ----
let photos = [];            // { img, url }  url = link trên server (nếu đã tải lên). Rỗng = chỉ hiện trái tim

function addImage(src, url = null) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => { photos.push({ img, url }); resolve(true); };
    img.onerror = () => resolve(false);
    img.src = src;
  });
}

const cardFit = () => FIT * (innerWidth < 600 ? 0.72 : 1);   // điện thoại: thẻ ảnh nhỏ bớt để không chồng nhau

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function layoutPhotos(time) {
  // bán kính vòng: không cho ảnh tràn khỏi mép màn hình (quan trọng trên điện thoại)
  const n = photos.length, out = [], R = Math.min(ORBIT_RADIUS * FIT, innerWidth / 2 - PHOTO_W * cardFit() * 0.8);
  const RZ = R * ORBIT_DEPTH;                       // bán kính theo chiều sâu (elip ngang)
  for (let i = 0; i < n; i++) {
    const t = time * ORBIT_SPEED + (i / n) * Math.PI * 2;
    // a = t + E*cos(t): tốc độ góc = 1 - E*sin(t) -> chậm nhất ở phía trước (sin=1), nhanh nhất ở phía sau
    const a = t + ORBIT_EASE * Math.cos(t);
    const x3 = R * Math.cos(a), z3 = RZ * Math.sin(a);    // z > 0: phía trước tim, z < 0: phía sau
    const y3 = z3 * (innerWidth < 600 ? 1.2 : ORBIT_TILT);   // điện thoại: nghiêng nhiều hơn để ảnh chạy phía dưới tim
    const scale = PERSPECTIVE / (PERSPECTIVE - z3 * 0.9);
    // ẩn dần khi chạy ra sau tim: hiện rõ khi z > 0.15R, mất hẳn khi z < -0.15R
    const visible = Math.max(0, Math.min(1, (z3 / RZ + 0.15) / 0.3));
    if (visible > 0) out.push({ img: photos[i].img, x: CX + x3 * scale, y: CY + y3 * scale, z: z3, scale, visible, R: RZ });
  }
  out.sort((p, q) => p.z - q.z);
  return out;
}

function drawCard(ctx, p) {
  const f = p.scale * cardFit(), w = PHOTO_W * f, h = PHOTO_H * f, r = PHOTO_RADIUS * f;
  const depth = (p.z + p.R) / (2 * p.R);
  const x = p.x - w / 2, y = p.y - h / 2;
  const img = p.img, ar = PHOTO_W / PHOTO_H;
  let sw = img.width, sh = img.height;                       // cắt ảnh theo tỉ lệ thẻ (kiểu cover)
  if (sw / sh > ar) sw = sh * ar; else sh = sw / ar;
  const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
  const alpha = (0.5 + 0.5 * depth) * p.visible * photosAlpha;

  // ảnh chính, không viền, không bóng
  ctx.save();
  ctx.globalAlpha = alpha;
  roundRect(ctx, x, y, w, h, r); ctx.clip();
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  ctx.restore();

  // phản chiếu kiểu mặt nước: lật ngược xuống dưới rồi mờ dần
  const rh = h * REFLECT_HEIGHT, ry = y + h + REFLECT_GAP * f;
  ctx.save();
  ctx.globalAlpha = alpha * REFLECT_ALPHA;
  roundRect(ctx, x, ry, w, rh, r); ctx.clip();
  ctx.translate(0, ry * 2 + h);                              // lật dọc quanh mép dưới ảnh
  ctx.scale(1, -1);
  ctx.drawImage(img, sx, sy, sw, sh, x, ry, w, h);           // vẽ lại ảnh (đã lật) đúng khung phản chiếu
  ctx.restore();
  // phủ dải đen mờ dần để phản chiếu tan vào nền như mặt nước
  ctx.save();
  roundRect(ctx, x, ry, w, rh, r); ctx.clip();
  const g = ctx.createLinearGradient(0, ry, 0, ry + rh);
  g.addColorStop(0, "rgba(0,0,0,0.15)");
  g.addColorStop(1, "rgba(0,0,0,1)");
  ctx.fillStyle = g; ctx.fillRect(x, ry, w, rh);
  ctx.restore();
}

// ---- Thông báo ----
const toastEl = document.getElementById("toast");
let toastTimer;
function toast(msg, ms = 2500) {
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastTimer); if (ms > 0) toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms);
}

// ---- Thu nhỏ ảnh trước khi tải lên ----
function compressImage(file, maxSide = UPLOAD_MAX_SIDE) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("toBlob")), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load")); };
    img.src = url;
  });
}

async function uploadBlob(blob, name, kind = "photo") {
  const r = await fetch("/api/upload?type=image/jpeg&kind=" + kind + "&name=" + encodeURIComponent(name), { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: blob });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "upload " + r.status);
  return (await r.json()).url;
}

// ---- Chế độ: người tạo (có form) / người xem qua link QR (chỉ nút Xem lại) ----
const albumId = new URLSearchParams(location.search).get("a");
const isViewer = !!albumId;
if (isViewer) document.body.classList.add("viewer");

let messages = [...DEFAULT_MESSAGES];
let soundEnabled = true;                                      // người tạo chọn có tiếng tim đập hay không
if (!isViewer) {
  try { const saved = JSON.parse(localStorage.getItem("hdt_messages")); if (Array.isArray(saved)) messages = saved; } catch {}
  try { const sv = localStorage.getItem("hdt_sound"); if (sv !== null) soundEnabled = sv === "1"; } catch {}
}

// ---- Form thiết lập ----
const setupModal = document.getElementById("setupModal"), msgText = document.getElementById("msgText");
const soundChk = document.getElementById("soundChk"), setupStatus = document.getElementById("setupStatus");
const coverPrev = document.getElementById("coverPrev"), thumbsEl = document.getElementById("thumbs");
const status = msg => { setupStatus.textContent = msg; };
function renderForm() {
  msgText.value = messages.join("\n");
  soundChk.checked = soundEnabled;
  if (coverImg) { coverPrev.src = coverImg.src; coverPrev.hidden = false; } else coverPrev.hidden = true;
  thumbsEl.innerHTML = "";
  photos.forEach((p, i) => {
    const t = document.createElement("div"); t.className = "t";
    const im = document.createElement("img"); im.src = p.img.src; t.appendChild(im);
    const x = document.createElement("button"); x.textContent = "×"; x.title = "Bỏ ảnh này";
    x.onclick = () => { photos.splice(i, 1); renderForm(); };
    t.appendChild(x); thumbsEl.appendChild(t);
  });
}
function applyForm() {
  messages = msgText.value.split("\n").map(l => l.trim()).filter(Boolean).slice(0, 30);
  soundEnabled = soundChk.checked;
  try { localStorage.setItem("hdt_messages", JSON.stringify(messages)); localStorage.setItem("hdt_sound", soundEnabled ? "1" : "0"); } catch {}
  if (!soundEnabled) soundOn = false;
}
document.getElementById("setupBtn").onclick = () => { renderForm(); status(""); setupModal.classList.add("show"); };
document.getElementById("setupCloseBtn").onclick = () => { applyForm(); setupModal.classList.remove("show"); };
setupModal.addEventListener("click", e => { if (e.target === setupModal) { applyForm(); setupModal.classList.remove("show"); } });
document.getElementById("previewBtn").onclick = () => { applyForm(); setupModal.classList.remove("show"); startIntro(); };
document.getElementById("replayBtn").onclick = () => startIntro();

// ---- Ảnh nền (cổ đến ngực) ----
let coverImg = null, coverUrl = null;                         // coverUrl = link trên server (để lưu vào album)
function setCover(src, url = null) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => { coverImg = img; coverUrl = url; resolve(true); };
    img.onerror = () => resolve(false);
    img.src = src;
  });
}
const coverInput = document.getElementById("coverFile");
document.getElementById("coverPick").onclick = () => coverInput.click();
document.getElementById("coverClear").onclick = () => { coverImg = null; coverUrl = null; renderForm(); status("Đã bỏ ảnh nền."); };
coverInput.onchange = async () => {
  const f = coverInput.files[0]; coverInput.value = "";
  if (!f) return;
  try {
    const small = await compressImage(f, COVER_MAX_SIDE);
    await setCover(URL.createObjectURL(small));
    renderForm();
    if (location.protocol.startsWith("http")) {
      status("Đang tải ảnh nền lên...");
      coverUrl = await uploadBlob(small, "cover.jpg", "cover");
      status("Đã đặt ảnh nền.");
    } else status("Đã đặt ảnh nền (tải lên server chỉ dùng được trên web).");
  } catch (e) { console.error(e); status("Không đặt được ảnh nền: " + e.message); }
};

// ---- Màn mở đầu: chữ -> (zoom ảnh nền) -> quầng đỏ, tim đập lớn dần -> tim đập -> ảnh thẻ ----
const intro = { phase: "wait", t0: 0 };                       // wait | text | cover | emerge | beat
let photosAlpha = 0;
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeInOut = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const easeOutCubic = u => 1 - Math.pow(1 - u, 3);
function startIntro() {
  intro.phase = "text"; intro.t0 = null; photosAlpha = 0;          // t0 lấy từ khung hình đầu tiên
  if (soundEnabled && !soundOn) toast("Chạm vào màn hình để bật tiếng tim đập", 3500);
}
function startGrow(now) { if (coverImg) { intro.phase = "cover"; intro.t0 = now; } else startEmerge(now); }
function startEmerge(now) { intro.phase = "emerge"; intro.t0 = now; frame = 3; lastHeart = now; playHeartbeat(); }
function startBeat(now) { intro.phase = "beat"; intro.t0 = now; }

// vẽ ảnh nền phủ kín màn và zoom dần vào tiêu điểm (vị trí tim); trả về tiến độ zoom 0..1
function drawCover(ctx, now, alpha = 1) {
  const img = coverImg, W = canvas.width, H = canvas.height;
  const el = Math.max(0, now - intro.t0);
  const fadeIn = clamp01(el / COVER_FADE_IN_MS);
  const u = intro.phase === "cover" ? clamp01((el - COVER_HOLD_MS) / COVER_ZOOM_MS) : 1;
  const e = easeInOut(u);
  const base = Math.max(W / img.width, H / img.height);          // phủ kín màn
  const sc = base * (1 + (COVER_ZOOM - 1) * e);
  const fx = img.width * COVER_FOCUS_X, fy = img.height * COVER_FOCUS_Y;
  const natX = W / 2 + (fx - img.width / 2) * base, natY = H / 2 + (fy - img.height / 2) * base;  // tiêu điểm khi chưa zoom
  const tx = natX + (W / 2 - natX) * e, ty = natY + (H / 2 - natY) * e;                            // kéo dần về tâm màn
  ctx.save();
  ctx.globalAlpha = alpha * fadeIn;
  ctx.drawImage(img, tx - fx * sc, ty - fy * sc, img.width * sc, img.height * sc);
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.12, W / 2, H / 2, Math.max(W, H) * 0.7);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, `rgba(0,0,0,${0.35 + 0.6 * e})`);   // tối dần viền
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  return u;
}
// quầng đỏ ở tâm màn
function drawGlow(ctx, intensity, radius) {
  if (intensity <= 0) return;
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, radius);
  g.addColorStop(0, `rgba(${GLOW_RGB}, ${0.9 * intensity})`);
  g.addColorStop(0.35, `rgba(${GLOW_RGB}, ${0.35 * intensity})`);
  g.addColorStop(1, `rgba(${GLOW_RGB}, 0)`);
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g;
  ctx.fillRect(CX - radius, CY - radius, radius * 2, radius * 2); ctx.restore();
}
function tickHeart(now) {                                       // tim đập cùng nhịp 160ms như bản Python
  if (now - lastHeart >= 160) {
    frame++; lastHeart = now;
    if (frame % 5 === 3) playHeartbeat();                       // mỗi 5 khung (0.8s) tim nở ra một lần -> "lub-dub"
  }
}

function wrapText(ctx, text, maxW) {
  const words = text.split(/\s+/), lines = []; let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function drawText(ctx, now) {
  const msgs = messages.filter(m => m.trim());
  if (!msgs.length) return startGrow(now);
  const per = TEXT_IN + TEXT_HOLD + TEXT_OUT, el = Math.max(0, now - intro.t0), i = Math.floor(el / per);
  if (i >= msgs.length) return startGrow(now);
  const lt = el - i * per;
  let a, drift;
  if (lt < TEXT_IN) { a = lt / TEXT_IN; drift = (1 - a) * 18; }
  else if (lt < TEXT_IN + TEXT_HOLD) { a = 1; drift = 0; }
  else { a = 1 - (lt - TEXT_IN - TEXT_HOLD) / TEXT_OUT; drift = -(1 - a) * 10; }
  a = Math.max(0, Math.min(1, a));
  const size = Math.round(Math.max(22, Math.min(46, innerWidth * 0.045)));
  ctx.save();
  ctx.globalAlpha = a * a;
  ctx.fillStyle = TEXT_COLOR; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `500 ${size}px "Segoe UI", system-ui, -apple-system, sans-serif`;
  ctx.shadowColor = HEART_COLOR; ctx.shadowBlur = 22;
  const lines = wrapText(ctx, msgs[i], innerWidth * 0.82), lh = size * 1.4;
  const y0 = CY + drift - (lines.length - 1) * lh / 2;
  lines.forEach((l, k) => ctx.fillText(l, CX, y0 + k * lh));
  ctx.restore();
}

// ---- Nút thêm ảnh ----
const fileInput = document.getElementById("file");
document.getElementById("photoPick").onclick = () => fileInput.click();
fileInput.onchange = async () => {
  const files = [...fileInput.files]; fileInput.value = "";
  if (!files.length) return;
  const isHosted = location.protocol.startsWith("http");
  let done = 0, failed = 0;
  for (const f of files) {
    try {
      const small = await compressImage(f);
      const localUrl = URL.createObjectURL(small);
      const entry = { img: null, url: null };
      await new Promise(res => { const img = new Image(); img.onload = () => { entry.img = img; photos.push(entry); res(); }; img.onerror = res; img.src = localUrl; });
      renderForm();
      if (isHosted) {
        status(`Đang tải lên ${done + 1}/${files.length}...`);
        entry.url = await uploadBlob(small, f.name.replace(/\.[^.]+$/, "") + ".jpg");
      }
      done++;
    } catch (e) { failed++; console.error(e); }
  }
  if (!isHosted) status("Đã thêm ảnh. Tải lên server và tạo QR chỉ dùng được khi chạy trên web (Vercel).");
  else if (failed) status(`Xong ${done} ảnh, ${failed} ảnh lỗi.`);
  else status(`Đã thêm ${done} ảnh.`);
};

// ---- Tạo QR ----
const modal = document.getElementById("modal"), qrEl = document.getElementById("qr"), linkEl = document.getElementById("link");
let shareUrl = "";
function showShare(url) {
  shareUrl = url; qrEl.innerHTML = ""; linkEl.textContent = url;
  new QRCode(qrEl, { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  modal.classList.add("show");
}
// Ghép ảnh QR để tải về: nền trắng, mã QR to, chú thích bên dưới
function buildQrImage() {
  const src = qrEl.querySelector("canvas") || qrEl.querySelector("img");
  if (!src) return null;
  const c = document.createElement("canvas"); c.width = 720; c.height = 860;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.imageSmoothingEnabled = false;
  g.drawImage(src, 80, 80, 560, 560);
  g.fillStyle = "#f76070"; g.textAlign = "center"; g.font = "600 40px 'Segoe UI', system-ui, sans-serif";
  g.fillText("Quét để xem trái tim", c.width / 2, 720);
  g.fillStyle = "#999"; g.font = "24px 'Segoe UI', system-ui, sans-serif";
  g.fillText("HungDam_TraiTim", c.width / 2, 770);
  return c;
}
async function downloadQr() {
  const c = buildQrImage();
  if (!c) return toast("Chưa có mã QR để tải", 2500);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const file = new File([blob], "traitim-qr.png", { type: "image/png" });
  // điện thoại: mở bảng chia sẻ để lưu vào thư viện ảnh / gửi đi
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "HungDam_TraiTim" }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  // máy tính hoặc trình duyệt không hỗ trợ chia sẻ file: tải thẳng về
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "traitim-qr.png";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast("Đã tải ảnh QR về máy", 2500);
}
document.getElementById("dlBtn").onclick = downloadQr;
document.getElementById("qrBtn").onclick = async () => {
  applyForm();
  if (!location.protocol.startsWith("http")) return status("Tạo QR chỉ dùng được khi chạy trên web (Vercel).");
  const urls = photos.map(p => p.url).filter(Boolean);
  const msgs = messages.filter(m => m.trim());
  if (!photos.length && !msgs.length && !coverUrl) return status("Hãy nhập lời nhắn hoặc thêm ảnh trước rồi mới tạo QR.");
  if (photos.length && urls.length < photos.length) return status("Có ảnh chưa tải lên được server, hãy bỏ ảnh đó rồi thêm lại.");
  try {
    status("Đang tạo link...");
    const r = await fetch("/api/album", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ images: urls, messages: msgs, cover: coverUrl, sound: soundEnabled }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "album " + r.status);
    const { id } = await r.json();
    status("");
    setupModal.classList.remove("show");
    showShare(location.origin + location.pathname + "?a=" + id);
  } catch (e) { console.error(e); status("Không tạo được link: " + e.message); }
};
document.getElementById("closeBtn").onclick = () => modal.classList.remove("show");
modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("show"); });
document.getElementById("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(shareUrl); toast("Đã sao chép link"); }
  catch { toast("Không sao chép được, hãy chọn và copy link ở trên", 3000); }
};
document.getElementById("shareBtn").onclick = async () => {
  if (navigator.share) { try { await navigator.share({ title: "HungDam_TraiTim", url: shareUrl }); } catch {} }
  else toast("Trình duyệt này không hỗ trợ chia sẻ, hãy sao chép link", 3000);
};

// ---- Tải album khi mở link chia sẻ (?a=...) ----
async function loadAlbum(id) {
  try {
    const r = await fetch("/api/album?id=" + encodeURIComponent(id));
    if (!r.ok) throw new Error("album " + r.status);
    const data = await r.json();
    messages = Array.isArray(data.messages) ? data.messages : [];
    soundEnabled = data.sound !== false;
    if (data.cover) await setCover(data.cover, data.cover);
    if (Array.isArray(data.images)) await Promise.all(data.images.map(u => addImage(u, u)));
  } catch (e) { console.error(e); messages = []; toast("Không tải được nội dung của link này.", 4000); }
  startIntro();
}

// ---- Âm thanh tim đập (Web Audio, không cần file) ----
let audioCtx = null, soundOn = false;

let master = null;                                 // tầng khuếch đại chung + nén để to mà không rè
function getMaster() {
  if (master) return master;
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 20; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
  master = audioCtx.createGain(); master.gain.value = 2.2 * SOUND_VOLUME;
  master.connect(comp); comp.connect(audioCtx.destination);
  return master;
}
function thump(when, freq, gain, dur) {           // một tiếng "thụp" trầm
  const o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
  o.type = "sine";
  o.frequency.setValueAtTime(freq, when);
  o.frequency.exponentialRampToValueAtTime(Math.max(18, freq * 0.4), when + dur);
  f.type = "lowpass"; f.frequency.value = 120; f.Q.value = 1.2;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(gain, when + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(f); f.connect(g); g.connect(getMaster());
  o.start(when); o.stop(when + dur + 0.05);
}
function playHeartbeat() {                         // "lub" rồi "dub" nhẹ hơn sau 0.15s
  if (!soundEnabled || !soundOn || !audioCtx || audioCtx.state !== "running" || (intro.phase !== "beat" && intro.phase !== "emerge")) return;
  const t = audioCtx.currentTime + 0.01;
  thump(t, 48, 1.0, 0.30);
  thump(t + 0.15, 42, 0.65, 0.26);
}
async function setSound(on) {
  if (on) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    try { await audioCtx.resume(); } catch {}
    if (audioCtx.state !== "running") { toast("Không bật được âm thanh, hãy chạm lại vào màn hình.", 3000); return; }
  }
  soundOn = on;
}
// chạm/click vào trang là bật tiếng (trình duyệt chỉ cho phát âm sau khi người dùng tương tác), nếu người tạo có bật âm thanh
addEventListener("pointerdown", e => {
  if (e.target.closest("#bar, .modal")) return;
  if (soundEnabled && !soundOn) setSound(true);
});

// ---- Vòng lặp ----
const canvas = document.getElementById("heart"), ctx = canvas.getContext("2d");
function resize() {
  canvas.width = innerWidth; canvas.height = innerHeight; CX = canvas.width / 2; CY = canvas.height / 2;
  FIT = Math.min(1, innerWidth / 1500, innerHeight / 820);   // màn nhỏ thì thu cả tim lẫn vòng ảnh lại cho vừa
  if (innerWidth < 600) FIT = Math.min(1, innerWidth / 760, innerHeight / 820);  // điện thoại: cho to hơn chút
}
addEventListener("resize", resize); resize();

const heart = new Heart();
let frame = 0, lastHeart = 0;
if (albumId) loadAlbum(albumId);                              // link QR: tải nội dung xong mới chạy
else setCover(COVER_IMAGE).then(startIntro);                  // người tạo: thử nạp ảnh nền mặc định rồi chạy

function loop(now) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (intro.phase === "wait") return requestAnimationFrame(loop);
  if (intro.t0 === null) intro.t0 = now;                       // đồng bộ mốc thời gian với đồng hồ khung hình
  if (intro.phase === "text") { drawText(ctx, now); return requestAnimationFrame(loop); }

  const el = Math.max(0, now - intro.t0);
  const glowR = Math.min(canvas.width, canvas.height) * 0.45;

  if (intro.phase === "cover") {                                // zoom vào ngực, gần tới thì quầng đỏ bắt đầu lóe
    const u = drawCover(ctx, now);
    if (u > 0.7) { const g = (u - 0.7) / 0.3; drawGlow(ctx, g * g * 0.8 * (0.85 + 0.15 * Math.sin(now / 90)), glowR * 0.6); }
    if (el >= COVER_HOLD_MS + COVER_ZOOM_MS + 150) startEmerge(now);
    return requestAnimationFrame(loop);
  }

  let grow = 1;
  if (intro.phase === "emerge") {                               // quầng đỏ lóe lên, tim đập lớn dần tới cỡ mặc định
    tickHeart(now);
    if (coverImg) drawCover(ctx, now, 1 - clamp01(el / COVER_FADE_OUT_MS));   // ảnh nền chìm dần vào đen
    const u = clamp01(el / EMERGE_MS);
    grow = Math.max(0.04, easeOutCubic(u));
    const flash = Math.max(0, 1 - el / 900);                                   // lóe mạnh rồi tắt dần
    const pulse = 0.35 * (1 - u) * Math.max(0, Math.sin((frame % 5) / 5 * Math.PI * 2 - Math.PI / 2) );  // nhấp theo nhịp
    drawGlow(ctx, flash + pulse, glowR * (0.5 + 0.5 * grow));
    if (u >= 1) startBeat(now);
  }
  if (intro.phase === "beat") {                                 // giữ cỡ mặc định, đập đều; vài giây sau ảnh thẻ chạy
    tickHeart(now);
    photosAlpha = clamp01((el - PHOTOS_DELAY_MS) / PHOTOS_FADE_MS);
  }
  const cards = photosAlpha > 0 ? layoutPhotos(now / 1000) : [];
  for (const p of cards) if (p.z < 0) drawCard(ctx, p);        // phần còn mờ ở hai bên
  heart.render(ctx, frame, grow);
  for (const p of cards) if (p.z >= 0) drawCard(ctx, p);       // ảnh phía trước tim
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
